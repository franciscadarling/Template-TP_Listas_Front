<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <img class="imagen" src="images.png">
      <div class="navegador">
        <h2>Buscador:</h2>
        <div class="busqueda"><input id="inputBusqueda" type="search" class="buscador" placeholder="Busca un plato">
      </div>
      <div class="div-filtros">
        <h2>Filtros:</h2>
        <select id="filtroTipo" class="filtros">
          <option disabled selected>Tipo de comida</option>
          <option>Frito</option>
          <option>Parrilla</option>
          <option>Horno</option>
          <option>Guiso</option>
        </select>
        <select id="filtroLugar" class="filtros">
          <option disabled selected>Lugar</option>
          <option>Buenos Aires</option>
          <option>Salta</option>
          <option>Tucumán</option>
          <option>Córdoba</option>
          <option>Jujuy</option>
          <option>Santa Fe</option>
          <option>Entre Ríos</option>
        </select>
      </div>
    </header>
    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="formulario">
        <label for="nombre">uwu</label>
        <input type="text" name="nombre" placeholder="Nombre de la comida" required>
        <label for="categoria">uwu</label>
        <input type="text" name="categoria" placeholder="Categoría de la comida" required>
        <label for="provincia">uwu</label>
        <input type="text" name="provincia" placeholder="Provincia de la comida" required>
        <label for="ingredientes">uwu</label>
        <input type="text" name="ingredientes" placeholder="Ingredientes de la comida" required>
        <button type="submit">botón</button>
      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
